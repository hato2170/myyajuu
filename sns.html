/* ======================
   Cloudinary画像アップロード
====================== */

async function uploadToCloudinary(
  file,
  maxSize = 800
) {

  if (!file) {

    throw new Error(
      "画像ファイルがありません"
    );

  }


  if (!file.type.startsWith("image/")) {

    throw new Error(
      "画像ファイルを選択してください"
    );

  }


  const compressed =
    await resizeImage(
      file,
      maxSize
    );


  const formData =
    new FormData();


  formData.append(
    "file",
    compressed,
    "image.jpg"
  );


  formData.append(
    "upload_preset",
    CLOUDINARY_UPLOAD_PRESET
  );


  const response =
    await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      {
        method: "POST",
        body: formData
      }
    );


  if (!response.ok) {

    let errorMessage =
      "Cloudinaryへの画像アップロードに失敗しました";

    try {

      const errorData =
        await response.json();

      console.error(
        "Cloudinary error:",
        errorData
      );


      if (
        errorData?.error?.message
      ) {

        errorMessage +=
          "\n" +
          errorData.error.message;

      }

    } catch (e) {

      console.error(e);

    }


    throw new Error(
      errorMessage
    );

  }


  const data =
    await response.json();


  if (!data.secure_url) {

    throw new Error(
      "Cloudinaryから画像URLを取得できませんでした"
    );

  }


  return data.secure_url;

}

function idToEmail(id) {

    "@schoolsns.local";

}


/* ======================
   IDチェック
====================== */

function validId(id) {

  return /^[a-zA-Z0-9_.-]{3,20}$/.test(id);

}


/* ======================
   パスワードチェック
====================== */

function validPassword(password) {

  if (!validPassword(password)) {

  }


  try {

      idToEmail(id);

        password
      );

/* ======================
   自分のプロフィール読み込み
====================== */

async function loadProfile() {

  if (!uid) return;


  const profileRef =
    doc(
      db,
      "users",
      uid
    );


  const snap =
    await getDoc(
      profileRef
    );


  if (!snap.exists()) {

    /* 古いユーザー用 */

    await setDoc(
      profileRef,
      {
        uid: uid,
        followers: [],
        following: []
      },
      {
        merge: true
      }
    );


    profileCache[uid] = {

      uid: uid,
      followers: [],
      following: []

    };


    return;

  }


  const d =
    snap.data();


  profileCache[uid] =
    d;


  /* 古いユーザーに
     フォロー情報がない場合 */

  if (
    !Array.isArray(d.followers) ||
    !Array.isArray(d.following)
  ) {

    await setDoc(
      profileRef,
      {
        followers:
          Array.isArray(d.followers)
            ? d.followers
            : [],

        following:
          Array.isArray(d.following)
            ? d.following
            : []

      },
      {
        merge: true
      }
    );


    profileCache[uid] = {

      ...d,

      followers:
        Array.isArray(d.followers)
          ? d.followers
          : [],

      following:
        Array.isArray(d.following)
          ? d.following
          : []

    };

  }

}


/* ======================
   プロフィール取得
====================== */

async function getProfile(userId) {


  if (!userId) return null;


  if (profileCache[userId]) {

    return profileCache[userId];

  }


  const snap =
    await getDoc(
      doc(
        db,
        "users",
        userId
      )
    );


  if (!snap.exists()) {

    return null;

  }


  const data =
    snap.data();


  profileCache[userId] =
    data;


  return data;

}

/* ======================
   管理者判定
====================== */

let isAdmin = false;

async function checkAdmin() {

  if (!uid) {
    isAdmin = false;
    return false;
  }

  try {

    const snap =
      await getDoc(
        doc(db, "users", uid)
      );

    if (!snap.exists()) {
      isAdmin = false;
      return false;
    }

    isAdmin =
      snap.data().role === "admin";

    return isAdmin;

  } catch (error) {

    console.error(
      "管理者判定エラー:",
      error
    );

    isAdmin = false;

    return false;
  }
}

  const followers =

  const following =

  const followStats =

  if (!followButton) return;


  if (userId === uid) {

  } else {

    const isFollowing =
      followers.includes(uid);

    } else {

      followButton.textContent =
        "👥 フォロー";

        "#1d9bf0";

    }

  }


  followStats.textContent =
    `フォロワー ${followers.length}　フォロー中 ${following.length}`;

}

async function () {

  if (!viewingProfileUserId) return;


  if (
    viewingProfileUserId === uid

    return;

  }


  const targetId =
    viewingProfileUserId;


  const myRef =
    doc(
      db,
      "users",
      uid
    );


  const targetRef =
    doc(
      db,
      "users",
      targetId
    );


  const mySnap =
    await getDoc(
      myRef
    );


  const targetSnap =
    await getDoc(
      targetRef
    );


  if (
    !mySnap.exists() ||
    !targetSnap.exists()
  ) {

    alert(
      "ユーザーが見つかりません"
    );

    return;

  }


  const myData =
    mySnap.data();


  const targetData =
    targetSnap.data();


  const following =
    Array.isArray(
      myData.following
    )
      ? myData.following
      : [];


  const followers =
    Array.isArray(
      targetData.followers
    )
      ? targetData.followers
      : [];


  const isFollowing =
    following.includes(
      targetId
    );


  const button =
    document.getElementById(
      "followButton"
    );


  if (button) {

    button.disabled =
      true;

  }


  try {

    if (isFollowing) {

      /* ======================
         フォロー解除
      ====================== */

      await updateDoc(
        myRef,
        {
          following:
            arrayRemove(
              targetId
            )
        }
      );


      await updateDoc(
        targetRef,
        {
          followers:
            arrayRemove(
              uid
            )
        }
      );


      profileCache[uid] = {

        ...(profileCache[uid] || {}),

        following:
          following.filter(
            id =>
              id !== targetId
          )

      };


      profileCache[targetId] = {

        ...(profileCache[targetId] || {}),

        followers:
          followers.filter(
            id =>
              id !== uid
          )

      };


    } else {

      /* ======================
         フォロー
      ====================== */

      await updateDoc(
        myRef,
        {
          following:
            arrayUnion(
              targetId
            )
        }
      );


      await updateDoc(
        targetRef,
        {
          followers:
            arrayUnion(
              uid
            )
        }
      );


      profileCache[uid] = {

        ...(profileCache[uid] || {}),

        following: [
          ...following,
          targetId
        ]

      };


      profileCache[targetId] = {

        ...(profileCache[targetId] || {}),

        followers: [
          ...followers,
          uid
        ]

      };

    }


    await updateFollowUI(
      targetId
    );


  } catch (error) {

    console.error(error);


    alert(
      "フォロー処理に失敗しました：\n" +
      error.message
    );


  } finally {

    if (button) {

      button.disabled =
        false;

    }

  }

};

let dmTargetUserId =
  null;

let dmUnsubscribe =
  null;

window.openDM = async function () {

  const input =
    document.getElementById("dmUserId");

  if (!input) return;

  let username =
    input.value.trim();

  if (!username) {
    alert("DMする相手のユーザー名を入力してください");
    return;
  }

  // @ が付いていてもOK
  username =
    username.replace(/^@/, "");

  if (!uid) {
    alert("ログインしてください");
    return;
  }

  try {

    // username からユーザーを検索
    const userQuery =
      query(
        collection(db, "users"),
        where("username", "==", username)
      );

    const snapshot =
      await getDocs(userQuery);

    if (snapshot.empty) {
      alert("そのユーザーが見つかりません");
      return;
    }

    const targetDoc =
      snapshot.docs[0];

    const targetId =
      targetDoc.id;

    if (targetId === uid) {
      alert("自分にはDMできません");
      return;
    }

    const profile =
      targetDoc.data();

    dmTargetUserId =
      targetId;

    if (dmUnsubscribe) {
      dmUnsubscribe();
      dmUnsubscribe = null;
    }

    const conversationId =
      [uid, dmTargetUserId]
        .sort()
        .join("_");

    const messagesQuery =
      query(
        collection(db, "messages"),
        where(
          "conversationId",
          "==",
          conversationId
        )
      );

    dmUnsubscribe =
      onSnapshot(
        messagesQuery,
        (snapshot) => {

          const messages =
            snapshot.docs
              .map((docSnap) => ({
                id: docSnap.id,
                ...docSnap.data()
              }))
              .sort(
                (a, b) =>
                  a.createdAt - b.createdAt
              );

          const dmChat =
            document.getElementById(
              "dmChat"
            );

          if (!dmChat) return;

          dmChat.innerHTML =
            `<p style="color:#aaa;">
              ${escapeHTML(
                profile.name ||
                username ||
                "名無し"
              )} さんとのDM
            </p>` +

            messages.map(
              (message) => {

                const isMine =
                  message.senderId === uid;

                return `
                  <div style="
                    text-align:${isMine ? "right" : "left"};
                    margin:8px 0;
                  ">
                    <span style="
                      display:inline-block;
                      max-width:80%;
                      padding:9px 12px;
                      border-radius:12px;
                      background:${isMine ? "#1d9bf0" : "#222"};
                      word-break:break-word;
                    ">
                      ${escapeHTML(
                        message.text || ""
                      )}
                    </span>
                  </div>
                `;

              }
            ).join("");

          dmChat.scrollTop =
            dmChat.scrollHeight;

        },
        (error) => {

          console.error(
            "DM受信エラー:",
            error
          );

        }
      );

    const dmChat =
      document.getElementById(
        "dmChat"
      );

    if (dmChat) {

      dmChat.innerHTML =
        `<p style="color:#aaa;">
          ${escapeHTML(
            profile.name ||
            username ||
            "名無し"
          )} さんとのDM
        </p>`;

    }

    const dmInputArea =
      document.getElementById(
        "dmInputArea"
      );

    if (dmInputArea) {
      dmInputArea.style.display =
        "block";
    }

  } catch (error) {

    console.error(
      "DMユーザー検索エラー:",
      error
    );

    alert(
      "DMユーザーの検索に失敗しました：\n" +
      error.message
    );

  }

};

/* ======================
   画像圧縮
====================== */

async function resizeImage(
  file,
  maxSize = 800
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onerror =
        reject;


      reader.onload =
        (e) => {

          const img =
            new Image();


          img.onerror =
            reject;


          img.onload =
            () => {

              const canvas =
                document.createElement(
                  "canvas"
                );


              let w =
                img.width;

              let h =
                img.height;


              if (w > h) {

                if (w > maxSize) {

                  h *=
                    maxSize / w;

                  w =
                    maxSize;

                }

              } else {

                if (h > maxSize) {

                  w *=
                    maxSize / h;

                  h =
                    maxSize;

                }

              }


              canvas.width =
                Math.round(w);

              canvas.height =
                Math.round(h);


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              canvas.toBlob(
                (blob) => {

                  if (blob) {

                    resolve(
                      blob
                    );

                  } else {

                    reject(
                      new Error(
                        "画像の圧縮に失敗しました"
                      )
                    );

                  }

                },
                "image/jpeg",
                0.8
              );

            };


          img.src =
            e.target.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}

      )
    );

    alert(
      "🗑️ 投稿を削除しました"
    );

  } catch (error) {

    console.error(
      "投稿削除エラー:",
      error
    );

    alert(
      "投稿の削除に失敗しました：\n" +
      error.message
    );

  }

};

/* ======================
   投稿HTML
====================== */

async function createPostHTML(
  p,
  id
) {

  const profile =
    await getProfile(
      p.owner
    );


  const name =
    profile?.name ||
    p.name ||
    "名無し";


  const username =
    profile?.username ||
    "";


  const image =
    profile?.profileImage ||
    createDefaultAvatar(
      name
    );


  /* ======================
     返信元
  ====================== */

  let replyHTML =
    "";


  if (p.replyTo) {

    const replyProfile =
      await getProfile(
        p.replyToOwner
      );


    const replyUsername =
      replyProfile?.username ||
      "";


    const replyName =
      replyProfile?.name ||
      p.replyToName ||
      "名無し";


    replyHTML = `

      <div class="replyTarget">

        ↪️
        ${escapeHTML(replyName)}

        ${
          replyUsername
          ? `
            @${escapeHTML(
              replyUsername
            )}
          `
          : ""
        }

        への返信

      </div>

    `;

  }


  return `

    <div class="post">

      <div
        class="postUser"
        onclick="showProfile('${escapeHTML(p.owner)}')"
      >

        <img
          class="postAvatar"
          src="${image}"
        >

        <div class="postUserInfo">

          <div class="postUserName">
            ${escapeHTML(name)}
          </div>

          <div class="postUserId">
            ${
              username
              ? "@" +
                escapeHTML(username)
              : ""
            }
          </div>

        </div>

      </div>


      ${replyHTML}


      <div style="margin-top:10px;">
        ${escapeHTML(
          p.text || ""
        )}
      </div>


      ${
        p.img
        ? `
          <img
            class="post-image"
            src="${p.img}"
            loading="lazy"
          >
        `
        : ""
      }


      <div class="actions">

        <span
          onclick="like('${escapeHTML(id)}')"
        >
          ❤️ ${
            (p.likes || [])
              .length
          }
        </span>


        <span
          onclick="showReplyBox('${escapeHTML(id)}')"
        >
          💬 返信
        </span>


        ${
  p.owner === uid || isAdmin
  ? `
    <span
      onclick="removePost(
        '${escapeHTML(id)}',
        '${escapeHTML(p.owner)}'
      )"
    >
      🗑️ 削除
    </span>
  `
  : ""
}
      </div>


      <!-- ======================
           返信入力
      ====================== -->

      <div
        id="replyBox-${escapeHTML(id)}"
        class="replyBox"
      >

        <div class="replyLabel">

          ${escapeHTML(name)}
          さんに返信

        </div>


        <input
 　　　　 id="replyInput-${escapeHTML(id)}"
  　　　　class="replyInput"
  　　　　type="text"
  　　　　inputmode="text"
  　　　　autocomplete="off"
 　　　　 placeholder="返信を書く..."
 　　　　 maxlength="500"
　　　　>

        <button
          onclick="reply(
            '${escapeHTML(id)}',
            '${escapeHTML(p.owner)}',
            '${escapeHTML(name)}'
          )"
        >
          💬 返信する
        </button>

      </div>

    </div>

  `;

}


/* ======================
   HTMLエスケープ
====================== */

function escapeHTML(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ======================
   タイムライン
====================== */

const q =
  query(
    collection(
      db,
      "posts"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  );

let latestPostsSnapshot =
  null;


/* ======================
   タイムライン表示
====================== */

async function renderTimeline(
  snapshot
) {

  const postsDiv =
    document.getElementById(
      "posts"
    );

  if (!postsDiv) return;

  postsDiv.innerHTML =
    "";

  const htmlList =
    await Promise.all(
      snapshot.docs.map(
        async (docSnap) => {

          const p =
            docSnap.data();

          const id =
            docSnap.id;

          return await createPostHTML(
            p,
            id
          );

        }
      )
    );

  postsDiv.innerHTML =
    htmlList.join("");

}


/* ======================
   タイムライン
====================== */


onSnapshot(
  q,
  async (snapshot) => {

    latestPostsSnapshot =
      snapshot;

    await renderTimeline(
      snapshot
    );

  },
  (error) => {

    console.error(
      "タイムラインエラー:",
      error
    );

  }
);
  
/* ======================
   プロフィールの投稿
====================== */

async function loadProfilePosts(
  userId
) {

  const profilePosts =
    document.getElementById(
      "profilePosts"
    );


  profilePosts.innerHTML =
    "読み込み中...";


  const posts =
    [];


  const snapshot =
    await new Promise(
      (resolve) => {

        onSnapshot(
          q,
          (snap) => {

            resolve(
              snap
            );

          },

          () => {

            resolve(
              null
            );

          }
        );

      }
    );


  if (!snapshot) {

    profilePosts.innerHTML =
      "投稿を読み込めませんでした";

    return;

  }


  snapshot.forEach(
    (docSnap) => {

      const p =
        docSnap.data();


      if (
        p.owner === userId
      ) {

        posts.push({

          data:
            p,

          id:
            docSnap.id

        });

      }

    }
  );


  if (
    posts.length === 0
  ) {

    profilePosts.innerHTML =
      `
        <div style="color:#777;">
          まだ投稿がありません
        </div>
      `;

    return;

  }


  profilePosts.innerHTML =
    "";


  for (
    const item of posts
  ) {

    const html =
      await createPostHTML(
        item.data,
        item.id
      );


    profilePosts.innerHTML +=
      html;

  }

}
