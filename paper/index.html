<html>
  <head>
    <script id="gamemonetize-sdk" type="text/javascript" src="js/sdk.js"></script>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#2d3331" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Paper.io 2</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="images/icon192.png" />
    <link rel="shortcut icon" type="image/png" href="images/icon192.png" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style3.css" />
  </head>
  <body>
    <!-- Top bar for direct standalone tab -->
    <div id="topNavDirect" style="display:none; position:fixed; top:10px; left:10px; z-index:999999; gap:8px;">
      <button onclick="window.location.href='../sns.html'" style="background:#1e293b; color:#fff; border:1px solid #475569; padding:6px 14px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:13px;">
        ← チャットへ戻る
      </button>
      <button onclick="window.location.href='https://www.google.com/search?q=%E6%95%B0%E5%AD%A6+%E4%B8%80%E6%AC%A1%E9%96%A2%E6%95%B0'" style="background:#dc2626; color:#fff; border:none; padding:6px 14px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:13px;">
        🚨 緊急回避 (数学)
      </button>
    </div>
    <script>
      if (window.self === window.top) {
        document.getElementById('topNavDirect').style.display = 'flex';
      }
      window.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
          window.location.href = "https://www.google.com/search?q=%E6%95%B0%E5%AD%A6+%E4%B8%80%E6%AC%A1%E9%96%A2%E6%95%B0";
        }
      });
    </script>
    <script type="text/javascript" src="js/window.js"></script>
    <script type="text/javascript" src="js/loader.js"></script>
    <script type="text/javascript" src="js/app-new-gm.js?26"></script>
    <div id="game">
      <canvas class="fadein" id="view" width="922" height="888"></canvas>
      <div id="ui_overlay"></div>
      <div id="ui" class="">
        <div id="left_side"></div>
        <div class="uibox">
          <div class="logo"><img src="images/logo.png" /></div>
          <div class="tips"><div class="tip">Bite enemy tails but don't let them bite yours!</div></div>
          <form class="play"><input type="text" id="nick" name="nick" autocomplete="off" placeholder="Your name" maxlength="12" /><button id="play" name="play" class="yellow">PLAY</button></form>
          <div id="adbanner"></div>
        </div>
        <div id="right_side">
          <div class="own_banner">
            <a href="https://topvaz.github.io/" target="_blank">Homepage</a>
          </div>
        </div>
      </div>
      <div id="footer">
        <ul id="lng">
          <li class="active">EN</li>
          <li class="">RU</li>
          <li class="">TR</li>
          <li class="">SP</li>
          <li class="">FR</li>
          <li class="">NL</li>
          <li class="">PT</li>
          <li class="">DE</li>
          <li class="">IT</li>
        </ul>
        <div id="bottom"><a href="/" target="_blank">Homepage</a></div>
      </div>
      <div id="overlay"></div>
    </div>
    <div id="imaContainer" style="position: absolute; z-index: 10000; top: 0px; left: 0px; width: 100%; height: 100%; background-color: rgb(0, 0, 0); visibility: hidden; overflow: hidden;"><video id="imaVideo"></video></div>
  </body>
</html>
