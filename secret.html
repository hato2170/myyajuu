<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Page</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: white;
  color: black;
  font-family: Arial, sans-serif;
}

#secretText {
  position: fixed;
  top: 10px;
  left: 10px;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
}
</style>
</head>

<body>

<div id="secretText">
  This service has been suspended by its owner.
</div>

<script>

let count = 0;
let timer = null;

const secretText = document.getElementById("secretText");

secretText.onclick = function() {

  count++;

  console.log("クリック回数:", count);

  clearTimeout(timer);

  timer = setTimeout(function() {
    count = 0;
  }, 2000);

  if (count === 5) {
    window.location.href = "./index.html";
  }

};

</script>

</body>
</html>
